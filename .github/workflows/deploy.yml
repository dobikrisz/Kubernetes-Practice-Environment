name: Deploy Infrastructure

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      GOOGLE_PROJECT_ID: gke-sandbox-448713
      REGION: europe-west3
      BUCKET: k8s-backend-448713

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/411881544328/locations/global/workloadIdentityPools/github/providers/k8s-repo"
          service_account: "github-actions-sa@${{ env.GOOGLE_PROJECT_ID }}.iam.gserviceaccount.com"
          token_format: 'access_token'
          access_token_lifetime: '3600s'

      - name: Create Backend Bucket
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          gsutil ls | grep ${{ env.BUCKET }}
          test $? -ne 0 && echo “Bucket ${{ env.BUCKET }} doesn't exist, creating..." && gcloud storage buckets create gs://${{ env.BUCKET }} --project=${{ env.GOOGLE_PROJECT_ID }} --location=EU && exit 0
         
          echo "Bucket ${{ env.BUCKET }} already exists."
          

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        working-directory: infrastructure
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: terraform init -backend-config="bucket=${{ env.BUCKET }}"

      - name: Terraform Plan
        working-directory: infrastructure
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          TF_VAR_PROJECT_ID: ${{ env.GOOGLE_PROJECT_ID }}
          TF_VAR_REGION: ${{ env.REGION }}
        run: terraform plan 

      - name: Terraform Apply
        working-directory: infrastructure
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          TF_VAR_PROJECT_ID: ${{ env.GOOGLE_PROJECT_ID }}
          TF_VAR_REGION: ${{ env.REGION }}
        run: terraform apply --auto-approve 
            

